services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: conjunctions
      POSTGRES_USER: conjunctions
      POSTGRES_PASSWORD: conjunctions
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conjunctions -d conjunctions"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://conjunctions:conjunctions@postgres:5432/conjunctions
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
